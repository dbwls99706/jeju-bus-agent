<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="버스여울, 제주 버스 이용 기록을 쉽게 살펴보는 도구"><rect width="1200" height="630" rx="28" fill="#f6f4eb"/><rect x="56" y="58" width="76" height="76" rx="22" fill="#275238"/><path d="M73 109q21-38 42 0" fill="none" stroke="#fff9e9" stroke-width="8" stroke-linecap="round"/><g font-family="Noto Sans KR,Malgun Gothic,sans-serif" fill="#213b2c"><text x="157" y="111" font-size="42" font-weight="700">버스여울</text><text x="65" y="252" font-size="58" font-weight="700">제주 버스 이용 기록,</text><text x="65" y="335" font-size="58" font-weight="700" fill="#275238">쉽게 살펴보세요.</text><text x="68" y="407" font-size="27" fill="#4e5e51">조건을 고르고 · 확인하고 · 결과 보기</text><text x="68" y="553" font-size="23" fill="#534830">과거 기록 분석 도구 · 실시간 혼잡도 안내 아님</text></g><circle cx="1002" cy="165" r="53" fill="#edbc76"/><path d="M760 468q140-110 360-35v75H760z" fill="#c9d7c0"/><rect x="795" y="282" width="292" height="145" rx="27" fill="#275238"/><g fill="#fff9e9"><rect x="816" y="305" width="55" height="49" rx="6"/><rect x="885" y="305" width="55" height="49" rx="6"/><rect x="954" y="305" width="108" height="94" rx="6"/></g><circle cx="849" cy="428" r="26" fill="#213b2c"/><circle cx="1035" cy="428" r="26" fill="#213b2c"/><path d="M786 484q76-28 143 0t174 0" fill="none" stroke="#78937c" stroke-width="8" stroke-linecap="round"/></svg>
